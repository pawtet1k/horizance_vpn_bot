<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">

  <defs>
    <linearGradient id="hzg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5ea0ff"/><stop offset="1" stop-color="#1246b8"/>
    </linearGradient>
    <linearGradient id="hzc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2563eb" stop-opacity="0.34"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="1" r="1">
      <stop stop-color="#5ea0ff" stop-opacity="0.5"/><stop offset="1" stop-color="#5ea0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1c2537" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ea0ff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#5ea0ff" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0d0d0d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="240" cy="120" rx="520" ry="340" fill="url(#glow1)"/>
  <ellipse cx="1030" cy="240" rx="440" ry="320" fill="url(#glow2)"/>

  <text x="600" y="140" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19"
        font-weight="600" fill="#22d3ee" letter-spacing="7">РЕЖИМ ПЕРЕЧНЯ</text>

  <!-- список: разрешённые строки слева, недоступные справа -->
  <g transform="translate(600,330)">
    <!-- панель -->
    <rect x="-330" y="-125" width="660" height="250" rx="26" fill="#101014" stroke="#242424" stroke-width="3"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#242424" stroke-width="2" stroke-dasharray="6 10"/>

    <!-- слева: доступно -->
    <text x="-290" y="-88" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15"
          font-weight="700" fill="#34d399" letter-spacing="3">ОТКРЫВАЕТСЯ</text>
    <g stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-288 -42 l10 10 l18 -22"/>
      <path d="M-288 6 l10 10 l18 -22"/>
      <path d="M-288 54 l10 10 l18 -22"/>
    </g>
    <g fill="#3a4152">
      <rect x="-244" y="-50" width="180" height="14" rx="7"/>
      <rect x="-244" y="-2" width="150" height="14" rx="7"/>
      <rect x="-244" y="46" width="196" height="14" rx="7"/>
    </g>

    <!-- справа: недоступно -->
    <text x="290" y="-88" text-anchor="end" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15"
          font-weight="700" fill="#6b7280" letter-spacing="3">НЕ ОТКРЫВАЕТСЯ</text>
    <g stroke="#4b5563" stroke-width="4" stroke-linecap="round">
      <path d="M46 -46 l16 16 M62 -46 l-16 16"/>
      <path d="M46 2 l16 16 M62 2 l-16 16"/>
      <path d="M46 50 l16 16 M62 50 l-16 16"/>
    </g>
    <g fill="#242a36">
      <rect x="86" y="-50" width="196" height="14" rx="7"/>
      <rect x="86" y="-2" width="164" height="14" rx="7"/>
      <rect x="86" y="46" width="184" height="14" rx="7"/>
    </g>
  </g>

  <text x="600" y="540" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="58"
        font-weight="800" fill="#f0f0f0" letter-spacing="1.5">БЕЛЫЕ СПИСКИ</text>

  <!-- свечение горизонта -->
  <ellipse cx="600" cy="618" rx="620" ry="140" fill="url(#sunglow)" opacity="0.55"/>
  <g stroke-linecap="round" fill="none">
    <path d="M70 600 H1130" stroke="url(#streak)" stroke-width="3.5"/>
    <path d="M250 630 H950" stroke="url(#streak)" stroke-width="2" opacity="0.5"/>
  </g>
  <g fill="#5ea0ff">
    <circle cx="150" cy="572" r="2.5" opacity="0.5"/>
    <circle cx="1055" cy="564" r="2.5" opacity="0.55"/>
    <circle cx="890" cy="590" r="2" opacity="0.35"/>
    <circle cx="310" cy="588" r="2" opacity="0.35"/>
  </g>

  <g transform="translate(46,40)">
    <g transform="scale(0.30)">
      <g stroke="url(#hzg)" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="59.7" y1="19.4" x2="59.7" y2="3.9"/>
        <line x1="37.8" y1="25.5" x2="29.8" y2="11.9"/>
        <line x1="81.6" y1="25.5" x2="89.6" y2="11.9"/>
        <line x1="22.0" y1="41.7" x2="8.3" y2="34.1"/>
        <line x1="97.4" y1="41.7" x2="111.1" y2="34.1"/>
        <path d="M25.2 62.5 A34.4 34.4 0 0 1 94.0 62.5" stroke-width="7.5"/>
        <path d="M8.3 62.5 H111.1"/>
        <path d="M8.3 62.5 A51.4 53.8 0 0 0 111.1 62.5"/>
        <path d="M15.9 90 H103.5"/>
        <line x1="59.7" y1="62.5" x2="59.7" y2="115.8"/>
        <path d="M32.2 62.5 A27.5 53.3 0 0 0 87.2 62.5"/>
      </g>
    </g>
    <text x="48" y="24" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700"
          fill="#e8e8e8" letter-spacing="2.5">HORIZANCE<tspan fill="#5ea0ff"> · БЛОГ</tspan></text>
  </g>

</svg>
