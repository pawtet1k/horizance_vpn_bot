  <text x="790" y="445" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="600" fill="#888888" letter-spacing="3">ПРИЛОЖЕНИЕ</text>
  <text x="600" y="528" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#f0f0f0" letter-spacing="1.5">РАСШИРЕНИЕ VS ПРИЛОЖЕНИЕ</text>


