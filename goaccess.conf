# Конфиг GoAccess для логов nginx этой машины.
# Используется скриптом site_stats.sh, руками задавать ничего не нужно.
#
# Формат лога задан в /etc/nginx/nginx.conf как vhost_combined: это обычный
# combined, но ПЕРВЫМ полем идёт $host. Без него два сайта (horizance.ru и
# horizancevpn.com) писали бы в один файл неразличимо.
#
# ВАЖНО: логи до 26.08.2026 лежат в старом формате (без $host) в
# /var/log/nginx/access.log.oldformat — для них нужен log-format без %v.

log-format %v %h %^[%d:%t %^] "%r" %s %b "%R" "%u"
date-format %d/%b/%Y
time-format %H:%M:%S

# Считаем людей, а не роботов: поисковые боты и сканеры уязвимостей дают
# больше половины запросов и полностью искажают картину.
ignore-crawlers true
crawlers-only false

# Свои же машины: ноды VPN стучатся друг к другу и в собственный сайт,
# плюс локальные проверки здоровья.
exclude-ip 127.0.0.1
exclude-ip 193.233.127.32
exclude-ip 162.222.206.185
exclude-ip 155.212.142.189
exclude-ip 194.31.174.238
exclude-ip 176.12.76.72
exclude-ip 163.192.140.167

# Статика только зашумляет список страниц.
ignore-panel STATIC_REQUESTS

# Различать 200 и 404 по одному и тому же пути.
http-method true
http-protocol false

# Разрешаем имена хостов не резолвить — иначе отчёт строится минутами.
with-mouse false
real-os true
